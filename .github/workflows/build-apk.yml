name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holiday-Checklist-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: 여행 체크리스트 APK 빌드 v${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          body: |
            ## ✈️ 여행 체크리스트 (Holiday Checklist) APK 릴리즈

            - **고정 서명 키 적용**: 이전 앱을 삭제하지 않고도 덮어쓰기 업데이트가 정상 동작합니다.
            - **버전**: v1.0.${{ github.run_number }} (빌드 번호: ${{ github.run_number }})
            - **주요 기능**:
              - 여행 기간(박/일)에 따른 날짜별 옷 및 수건 자동 생성
              - 👕 옷, 🛁 샤워도구, 🎵 기타(생리대 기본 포함) 카테고리
              - 체크 시 취소선 및 완료 상태 시각화
              - 커스텀 물품 자유 추가, 수정, 삭제
              - 독립적인 여행별 저장 및 관리 화면에서의 선택 삭제 지원
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}